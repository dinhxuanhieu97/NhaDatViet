# Nginx cho bds-api (Laravel) — môi trường phát triển.
server {
    listen 80;
    server_name localhost;
    root /var/www/bds-api/public;
    index index.php;

    charset utf-8;
    client_max_body_size 60M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # CORS cho bds-web gọi API từ origin khác.
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Ảnh tin đăng đã qua xử lý — cache dài vì tên file không đổi nội dung.
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass bds-api-php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Chặn thực thi PHP ngoài front controller.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/bds-api-error.log;
    access_log /var/log/nginx/bds-api-access.log;
}
